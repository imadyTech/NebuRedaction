[project]
name = "neburedaction"
version = "0.1.0"
description = "Python reference implementation of the nebuRedaction secret-credential classifier. Pre-release, under construction."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "imadyTech" }]
keywords = ["logging", "redaction", "secrets", "credentials", "privacy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/imadyTech/NebuRedaction"
Repository = "https://github.com/imadyTech/NebuRedaction"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neburedaction"]
