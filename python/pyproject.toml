[project]
name = "neburedaction"
version = "0.1.0"
description = "Experimental Python reference implementation of the nebuRedaction secret-credential classifier. Not recommended for production: accuracy gate G2 is not met (0.804 recall at a 0.1% false-positive rate against a 0.834 bar), and the false-positive rate is several times its target on log formats it was not trained on. Defence in depth only. No model weights are bundled."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "imadyTech" }]
keywords = ["logging", "redaction", "secrets", "credentials", "privacy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/imadyTech/NebuRedaction"
Repository = "https://github.com/imadyTech/NebuRedaction"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neburedaction"]
