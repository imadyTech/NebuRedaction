[project]
name = "neburedaction-workspace"
version = "0.0.0"
description = "Development workspace for nebuRedaction: synthetic data generation, labeling, training and evaluation."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.4.0",
    "neburedaction",
]
teacher = [
    "transformers>=4.57.0",
    "accelerate>=1.11.0",
    "safetensors>=0.6.0",
    "huggingface-hub>=0.36.0",
    "sentencepiece>=0.2.1",
    "psutil>=7.1.0",
    "laya>=0.4.2",
]
torch = [
    "torch>=2.9.0",
]

[tool.uv]
default-groups = ["dev"]
conflicts = []

[tool.uv.workspace]
members = ["python"]

[tool.uv.sources]
neburedaction = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/src", "datagen", "corpus", "labeling", "training", "eval", "tools"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]
ignore = [
    "D203",  # incompatible with D211 (blank line before class docstring)
    "D213",  # incompatible with D212 (multi-line summary position)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["python/tests"]
addopts = "-ra --strict-markers --strict-config"
