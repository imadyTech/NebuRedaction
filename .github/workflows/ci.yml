name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build imady.NebuRedaction.slnx --configuration Release

      # Covers §2.6 item 1 as far as it can be covered. The .NET suite runs on
      # both platforms, and the cross-platform parity it proves is the fixture
      # model's: §7 decided not to commit the trained model and `.gitignore`
      # excludes `data/`, so a runner has neither the model nor the corpus and
      # the real G3 comparison skips here. `tests/fixtures/fixture-model-v1.nrm`
      # is the 581-byte stand-in that keeps the binary reader, the tree walk and
      # the Platt calibration from going untested on Linux. Full G3, over 2,400
      # real samples, stays a local gate and the §9 report says so.
      - name: Test
        run: dotnet test imady.NebuRedaction.slnx --configuration Release --no-build

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        # Pinned to an exact release: astral-sh/setup-uv publishes no floating
        # v10 major tag, so `@v10` fails to resolve at job setup.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        # `train` is NR-0004's leftover (§2.6 item 2): without it `tests/training/`
        # cannot import the trainers and was silently not being run.
        run: uv sync --group dev --group datagen --group eval --group train --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Run explicitly as well as under the sweep above, so that a future
      # `testpaths` change cannot drop them without this step failing. The whole
      # directory runs; no subset was needed.
      - name: Training tests (NR-0004 leftover, §2.6 item 2)
        run: uv run pytest tests/training/ -v

      # No fixture corpus is committed: the generator emits format-correct vendor
      # credentials, which GitHub's push protection blocks — correctly. Generate
      # one here and validate that instead.
      - name: Generate a corpus and validate it against the unit schema
        run: >-
          uv run --group datagen python -m datagen.generate
          --config datagen/configs/v0.yaml --seed 20261011
          --size 500 --out "$RUNNER_TEMP/corpus"
          --manifest "$RUNNER_TEMP/manifest.json"

      - name: Validate
        run: >-
          uv run --group datagen python -m datagen.validate
          "$RUNNER_TEMP/corpus/train.jsonl"
          "$RUNNER_TEMP/corpus/val.jsonl"
          "$RUNNER_TEMP/corpus/test.jsonl"

  synthetic-manifest:
    name: synthetic-sample manifest
    runs-on: ubuntu-latest
    env:
      # Keep in step with the gitleaks rev in .pre-commit-config.yaml: the
      # manifest check is only as good as the rule set it scans with, so the
      # hook and CI must use the same one.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "${base}/v${GITLEAKS_VERSION}/${archive}"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group datagen --group eval --locked

      # Exercises tools/check_synthetic_manifest.py end to end, in both
      # directions: a generated corpus passes against its own manifest, and a
      # credential-shaped string the generator never produced is rejected. This
      # is what proves the guard behind the gitleaks allowlist for
      # tests/fixtures/synthetic/, now that no fixtures are committed.
      - name: Prove the synthetic-fixture guard works in both directions
        run: uv run --group datagen pytest tests/datagen/test_manifest_guard.py -v

      # Belt and braces: if anything ever does appear under the guarded path,
      # it must be a registered, generator-produced value.
      - name: Check anything under the guarded path is generator-produced
        run: uv run --group datagen python tools/check_synthetic_manifest.py

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Upload the report. Without it a failure says only "leaks detected,
          # see job summary" and there is nothing to act on from the outside —
          # which cost a debugging round the first time this job failed.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          # Keep in step with the gitleaks rev in .pre-commit-config.yaml, which
          # is what .gitleaks.toml already says this project scans with ("every
          # rule shipped with the gitleaks release in .pre-commit-config.yaml").
          # Unset, the action installs its own default — 8.24.3 as of this
          # writing — and the two disagree: on identical history, identical
          # command and identical config, 8.30.1 reports no leaks while 8.24.3
          # reports three, all of them AKIA-shaped literals in old test source
          # that 8.30.1's own allowlist suppresses. NR-0001 §9 hit the same
          # version skew from the other direction and fixed the literal; this
          # removes the skew itself.
          #
          # Note this pins *upward*: 8.30.1 carries more rules than 8.24.3, so
          # it is a stronger scan, not a relaxed one. No allowlist entry is
          # added for those findings, and none should be.
          GITLEAKS_VERSION: "8.30.1"
