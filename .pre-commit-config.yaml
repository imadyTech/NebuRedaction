# Security and hygiene hooks for nebuRedaction.
#
# Install once per clone:  pre-commit install
# Run over everything:     pre-commit run --all-files
minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (block credentials from entering the repository)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        # Line endings are owned by .gitattributes (LF everywhere except
        # MSBuild and PowerShell files); this hook only rejects files that mix
        # both within a single file.
        args: ["--fix=auto"]
      - id: forbid-submodules
      - id: detect-private-key
