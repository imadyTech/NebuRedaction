# Security and hygiene hooks for nebuRedaction.
#
# Install once per clone:  pre-commit install
# Run over everything:     pre-commit run --all-files
minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (block credentials from entering the repository)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        # Line endings are owned by .gitattributes (LF everywhere except
        # MSBuild and PowerShell files); this hook only rejects files that mix
        # both within a single file.
        args: ["--fix=auto"]
      - id: forbid-submodules
      - id: detect-private-key
        # This hook matches the PEM marker line wherever it appears, which here
        # means three kinds of false positive. What still guards each is noted,
        # because an exclusion with nothing behind it is how a hook stops
        # working without anyone noticing.
        #
        #   tests/fixtures/synthetic/   generated PEM blocks with random bodies.
        #                               Guarded by the synthetic-sample manifest
        #                               hook below — every credential-shaped
        #                               string there must be generator-produced.
        #   datagen/families/           the marker strings the generator builds
        #   tests/datagen/              blocks from, and the assertions that
        #                               check it did. No key bodies. Still
        #                               scanned by gitleaks above, whose
        #                               private-key rule needs an actual body.
        exclude: |
          (?x)^(
            tests/fixtures/synthetic/.*
            |datagen/families/(_primitives|private_keys)\.py
            |tests/datagen/test_(families|manifest_and_lexicon)\.py
          )$

  - repo: local
    hooks:
      - id: check-synthetic-manifest
        name: synthetic-sample manifest (every credential-shaped fixture must be generator-produced)
        entry: python tools/check_synthetic_manifest.py
        language: system
        files: ^tests/fixtures/synthetic/
        pass_filenames: true
        # .gitleaks.toml exempts tests/fixtures/synthetic/ from the scan above,
        # because a credential detector needs credential-shaped fixtures. This
        # hook is what stands behind that exemption: it rescans the path with
        # the allowlist removed and requires every finding to appear in the
        # synthetic-sample manifest (NR-0001 §2.3).
