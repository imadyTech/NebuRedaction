# Key-name vocabulary for the synthetic generator (NR-0001 §2.2 item 4).
#
# PROVENANCE. Every name below comes from one of three permitted sources:
#   1. vendor documentation for the credential format concerned;
#   2. configuration conventions of widely used frameworks (ASP.NET Core
#      configuration, Spring Boot, Django settings, twelve-factor environment
#      variables, OpenTelemetry semantic conventions);
#   3. NebuLog's own demo-service logs.
#
# No name here was derived by counting key names in LogHub, CredData or SDLog.
# Plan §5.2 originally said to take the key-name distribution from open log
# templates; that contradicts plan §5.1, and §5.1 wins (see NR-0001 §2.2 item 4).
# LogHub and SDLog are not used at all in v0.1.
#
# THE THREE GROUPS.
#   sensitive  — the name points at a secret. A value under one of these is
#                probably a credential.
#   neutral    — the name says nothing either way.
#   misleading — the name contains a credential-suggesting word while the value
#                is not a credential. These are the trap, and they are what the
#                adversarial negatives are built from: NR-0000's Laya probe
#                found the teacher model classifying the user name in
#                "Failed password for invalid user <name>" as a password with
#                probability 0.972, purely because the word "password" was in
#                the template. A detector that keys on the word rather than the
#                value fails here, loudly.
#
# Each entry is a key name as it would appear in a log attribute. Casing is
# significant: real logs mix PascalCase (.NET), snake_case (Python),
# SCREAMING_SNAKE (environment variables) and kebab-case (HTTP headers), and the
# model's key-name tokeniser has to cope with all four (plan §4.2).

version: 1

# Names whose presence is evidence of a secret, grouped by the class they
# suggest. The generator prefers a key from the matching class when it wants a
# "hinting" context, and from another class when it wants a weaker signal.
sensitive:
  api_key:
    - ApiKey
    - API_KEY
    - api_key
    - apiKey
    - ClientSecret
    - CLIENT_SECRET
    - client_secret
    - SecretKey
    - SECRET_KEY
    - secretKey
    - AccessKeyId
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - SecretAccessKey
    - AccountKey
    - SubscriptionKey
    - Ocp-Apim-Subscription-Key
    - X-Api-Key
    - x-api-key
    - SENDGRID_API_KEY
    - STRIPE_SECRET_KEY
    - GITHUB_TOKEN
    - GH_TOKEN
    - GITLAB_TOKEN
    - NPM_TOKEN
    - NUGET_API_KEY
    - DATADOG_API_KEY
    - TWILIO_AUTH_TOKEN
    - DIGITALOCEAN_TOKEN
    - VAULT_TOKEN
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - GOOGLE_API_KEY
    - Credentials:ApiKey
    - Integrations:Stripe:SecretKey
  token:
    - Authorization
    - authorization
    - AccessToken
    - ACCESS_TOKEN
    - access_token
    - accessToken
    - RefreshToken
    - REFRESH_TOKEN
    - refresh_token
    - IdToken
    - id_token
    - BearerToken
    - bearer_token
    - SessionToken
    - session_token
    - AuthToken
    - auth_token
    - JwtToken
    - jwt
    - X-Auth-Token
    - X-Amz-Security-Token
    - Proxy-Authorization
  password:
    - Password
    - PASSWORD
    - password
    - passwd
    - pwd
    - Pwd
    - UserPassword
    - DbPassword
    - DB_PASSWORD
    - POSTGRES_PASSWORD
    - MYSQL_ROOT_PASSWORD
    - REDIS_PASSWORD
    - RABBITMQ_DEFAULT_PASS
    - GRAPHITE_PASS
    - SMTP_PASSWORD
    - Passphrase
    - passphrase
    - KeystorePassword
    - spring.datasource.password
  private_key:
    - PrivateKey
    - PRIVATE_KEY
    - private_key
    - privateKey
    - SigningKey
    - SIGNING_KEY
    - TLS_KEY
    - SSH_PRIVATE_KEY
    - GOOGLE_PRIVATE_KEY
    - JWT_PRIVATE_KEY
    - CertificateKey
    - pem
  connection_string:
    - ConnectionString
    - CONNECTION_STRING
    - connection_string
