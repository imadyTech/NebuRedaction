  - Identifier
  - Id
  - id
  - Code
  - Text
  - Line
  - Arg0
  - args
  - QueryString
  - RequestBody
  - ResponseBody
  - Header
  - headers
  - env
  - metadata

# The trap. Each name contains a credential-suggesting word while the value under
# it is not a credential. Used to build the adversarial negatives, which must be
# at least 10% of the negatives in every split (NR-0001 §2.2 item 4).
misleading:
  - tokenCount
  - TokenCount
  - token_count
  - maxTokens
  - PromptTokens
  - CompletionTokens
  - tokenizer
  - TokenizerVersion
  - secretary
  - SecretaryName
  - secretName
  - SecretRef
  - SecretVersion
  - SecretCount
  - passwordPolicy
  - PasswordPolicy
  - PasswordMinLength
  - PasswordExpiryDays
  - PasswordLastChanged
  - passwordResetUrl
  - PasswordStrength
  - RequiresPassword
  - HasPassword
  - keyCount
  - KeyCount
  - KeyName
  - KeyVaultName
  - PartitionKey
  - RowKey
  - SortKey
  - IdempotencyKey
  - CacheKey
  - RoutingKey
  - PublicKey
  - PublicKeyFingerprint
  - KeyId
  - KeyRotatedAt
  - hash
  - Hash
  - ContentHash
  - FileHash
  - PasswordHashAlgorithm
  - credentialType
  - CredentialCount
  - AuthScheme
  - AuthenticationType
  - AuthorizationPolicy
  - IsAuthenticated
  - LoginAttempts
  - FailedPasswordAttempts
  - TokenExpiresIn
  - TokenType
  - certificateThumbprint
  - ThumbprintAlgorithm

# Scopes, used as the `scope` field. Taken from OpenTelemetry semantic
# conventions and from how the three corpora are actually shaped.
scopes:
  - otel.attribute
  - otel.resource
  - config.env
  - config.appsettings
  - config.yaml
  - http.header
  - http.query
  - message.kv
  - message.slot
  - code.kwarg
  - db.connection
  - k8s.secret_ref
  - ci.variable
