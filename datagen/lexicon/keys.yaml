    - ConnectionStrings:Orders
    - REDIS_URL
    - MONGODB_URI
    - AMQP_URL
    - CELERY_BROKER_URL
    - AZURE_STORAGE_CONNECTION_STRING
    - spring.datasource.url
    - SQLALCHEMY_DATABASE_URI
  cookie:
    - Cookie
    - cookie
    - Set-Cookie
    - SessionCookie
    - AuthCookie
    - .AspNet.ApplicationCookie
    - JSESSIONID
    - PHPSESSID
    - laravel_session
    - connect.sid
    - csrftoken
    - XSRF-TOKEN

# Names that carry no signal. A secret under one of these is the case where the
# value has to speak for itself; a negative under one of these is the ordinary
# case that dominates real logs.
neutral:
  - Value
  - value
  - Data
  - data
  - Payload
  - payload
  - Field
  - Item
  - Input
  - Content
  - Result
  - Parameter
  - param
  - Attribute
  - Property
  - Setting
  - Config
  - Options
  - Detail
  - Extra
  - Context
